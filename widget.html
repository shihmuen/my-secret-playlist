<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>My Playlist</title>
<style>
  :root{
    --s:0.72;                          /* 縮放比例：由 JS 依視窗大小即時計算（基準寬 528 = 380/0.72） */
    /* ── 預設（未取到封面色時的中性玻璃）；取色後由 JS 覆寫這組變數 ── */
    --card-hi:rgba(245,245,244,.92);
    --card-lo:rgba(230,230,229,.90);
    --card-edge:rgba(255,255,255,.65);
    --ink:#1c1c1e;
    --ink-soft:rgba(60,60,67,.55);
    --wave:#8f8f92;
    --bar-bg:rgba(60,60,67,.22);
    --bar-fill:rgba(60,60,67,.65);
    --card-size:calc(420px * var(--s));
    --card-radius:calc(76px * var(--s));
    --disc-size:calc(444px * var(--s));
    --dy:0px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --card-hi:rgba(46,46,49,.92);
      --card-lo:rgba(24,24,26,.92);
      --card-edge:rgba(255,255,255,.14);
      --ink:#f5f5f7;
      --ink-soft:rgba(235,235,245,.55);
      --wave:rgba(235,235,245,.5);
      --bar-bg:rgba(235,235,245,.22);
      --bar-fill:rgba(235,235,245,.7);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    user-select:none;
  }

  .player{
    position:relative;
    width:var(--card-size);height:var(--card-size);
    border-radius:var(--card-radius);
    /* 拖曳區＝卡片本身；縮放用右下角把手 */
    -webkit-app-region:drag;
    background:linear-gradient(180deg,var(--card-hi) 0%,var(--card-lo) 100%);
    box-shadow:
      0 22px 44px -14px rgba(0,0,0,.28),
      0 8px 18px -8px rgba(0,0,0,.12),
      inset 0 0 0 1px var(--card-edge);
    transition:background .6s ease;
  }

  .clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;}

  .disc{
    position:absolute;left:50%;top:0;
    width:var(--disc-size);height:var(--disc-size);
    transform:translate(-50%,-50%) translateY(var(--dy));
    transition:transform .55s cubic-bezier(.32,.72,.28,1);
    will-change:transform;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));
    -webkit-app-region:no-drag;       /* CD 可點（播放/暫停） */
    cursor:pointer;
  }
  .disc-face{
    width:100%;height:100%;border-radius:50%;
    /* CD 中心真孔：遮罩挖穿，透出背後 */
    -webkit-mask:radial-gradient(circle, transparent 0 calc(26px * var(--s)), #000 calc(27px * var(--s)));
    mask:radial-gradient(circle, transparent 0 calc(26px * var(--s)), #000 calc(27px * var(--s)));
    background:linear-gradient(160deg,#c9c9c8 0%,#b4b4b3 100%);
    background-size:cover;background-position:center;
    animation:spin 9s linear infinite;
    position:relative;overflow:hidden;
  }
  .disc::after{
    /* CD 中心的透明塑膠環 */
    content:"";position:absolute;left:50%;top:50%;
    width:calc(124px * var(--s));height:calc(124px * var(--s));
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,255,255,0) 0 calc(26px * var(--s)),
      rgba(255,255,255,.32) calc(27px * var(--s)) calc(44px * var(--s)),
      rgba(255,255,255,.12) calc(45px * var(--s)) calc(58px * var(--s)),
      rgba(255,255,255,0) calc(60px * var(--s)));
    pointer-events:none;
  }
  .disc.air{z-index:4;pointer-events:none;-webkit-app-region:no-drag;}
  .disc.air[hidden]{display:none;}
  .player.paused .disc-face{animation-play-state:paused;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .disc-face::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 20deg,
      rgba(255,255,255,0) 0deg, rgba(255,255,255,.20) 40deg, rgba(255,255,255,0) 90deg,
      rgba(255,255,255,0) 170deg, rgba(255,255,255,.14) 215deg, rgba(255,255,255,0) 260deg);
    mix-blend-mode:screen;
  }

  .hub{
    position:absolute;left:50%;top:0;
    width:calc(84px * var(--s));height:calc(84px * var(--s));border-radius:50%;
    transform:translate(-50%,-50%) translateY(var(--dy));
    transition:transform .55s cubic-bezier(.32,.72,.28,1),opacity .3s ease;
    background:
      radial-gradient(circle,
        rgba(238,238,237,.30) 0 15%,
        rgba(180,180,180,.60) 15.5% 18%,
        rgba(244,244,243,.55) 18.5% 42%,
        rgba(188,188,188,.60) 42.5% 47%,
        rgba(232,232,231,.45) 47.5% 100%);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    box-shadow:0 2px 6px rgba(0,0,0,.14);
    pointer-events:none;
  }
  @media (prefers-color-scheme: dark){
    .hub{
      background:
        radial-gradient(circle,
          rgba(70,70,72,.35) 0 15%,
          rgba(150,150,152,.5) 15.5% 18%,
          rgba(95,95,98,.45) 18.5% 42%,
          rgba(155,155,158,.5) 42.5% 47%,
          rgba(85,85,88,.4) 47.5% 100%);
    }
  }

  /* ── 封面：圓形遮罩跟著 CD 移動、抵達中央後擴張成整張——像 CD 長成封面 ── */
  .cover{
    position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(160deg,#c9c9c8 0%,#b4b4b3 100%);
    background-size:cover;background-position:center;
    opacity:0;
    clip-path:circle(calc(226px * var(--s)) at 50% 0%);
    transition:clip-path .55s cubic-bezier(.32,.72,.28,1), opacity .18s ease .3s;
    will-change:clip-path,opacity;
    pointer-events:none;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:calc(44px * var(--s)) calc(48px * var(--s));
  }
  .cover .a{color:#fff;font-size:calc(24px * var(--s));font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.45);
    opacity:0;transform:translateY(6px);transition:opacity .25s ease, transform .3s ease;}
  .cover .t{color:rgba(255,255,255,.88);font-size:calc(14px * var(--s));font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.4);
    opacity:0;transform:translateY(6px);transition:opacity .25s ease, transform .3s ease;}

  /* 換片進行中（.switching）暫停 hover，避免兩套動畫搶戲 */
  .player:not(.empty):not(.switching):hover{--dy:calc(210px * var(--s));}
  .player:not(.empty):not(.switching):hover .disc{transform:translate(-50%,-50%) translateY(var(--dy)) scale(1.02);}
  .player:not(.empty):not(.switching):hover .cover{
    opacity:1;
    clip-path:circle(calc(304px * var(--s)) at 50% 50%);
    transition:clip-path .55s cubic-bezier(.32,.72,.28,1), opacity .1s ease;
  }
  .player:not(.empty):not(.switching):hover .cover .a,
  .player:not(.empty):not(.switching):hover .cover .t{opacity:1;transform:translateY(0);transition-delay:.3s;}
  .player:not(.empty):not(.switching):hover .hub{opacity:0;}
  .player:not(.empty):not(.switching):hover .info{opacity:0;transform:translateY(8px);}

  .player.eject{--dy:calc(-300px * var(--s));}
  .player.eject .hub{opacity:0;}
  .player.eject .disc{filter:drop-shadow(0 4px 10px rgba(0,0,0,.15));}

  .info{
    position:absolute;left:0;right:0;top:57%;
    display:flex;flex-direction:column;align-items:center;gap:calc(10px * var(--s));
    transition:opacity .3s ease,transform .3s ease;
  }
  .wave{display:flex;align-items:center;gap:2px;height:calc(18px * var(--s));}
  .wave i{width:2px;border-radius:2px;background:var(--wave);animation:bounce 1s ease-in-out infinite;}
  .wave i:nth-child(1){height:calc(8px * var(--s));animation-delay:0s;}
  .wave i:nth-child(2){height:calc(14px * var(--s));animation-delay:.15s;}
  .wave i:nth-child(3){height:calc(18px * var(--s));animation-delay:.3s;}
  .wave i:nth-child(4){height:calc(12px * var(--s));animation-delay:.45s;}
  .wave i:nth-child(5){height:calc(7px * var(--s));animation-delay:.6s;}
  @keyframes bounce{0%,100%{transform:scaleY(.55);}50%{transform:scaleY(1);}}
  .player.paused .wave i{animation-play-state:paused;transform:scaleY(.4);}

  .artist{font-size:calc(19px * var(--s));font-weight:500;color:var(--ink-soft);letter-spacing:.01em;max-width:calc(340px * var(--s));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .6s ease;}
  .title{font-size:calc(23px * var(--s));font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-top:-2px;max-width:calc(340px * var(--s));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .6s ease;}

  .bar{width:calc(66px * var(--s));height:3px;border-radius:2px;background:var(--bar-bg);overflow:hidden;margin-top:2px;}
  .bar b{display:block;height:100%;width:0%;background:var(--bar-fill);border-radius:2px;transition:width .25s linear;}

  .time{font-size:calc(19px * var(--s));font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;transition:color .6s ease;}
  .time span{color:var(--ink-soft);font-weight:500;}

  /* ── 縮放把手：貼著右下圓角外側的一條弧線（hover 浮現） ── */
  .grip{
    position:absolute;
    right:calc(-16px * var(--s));bottom:calc(-16px * var(--s));
    width:calc(44px * var(--s));height:calc(44px * var(--s));
    cursor:nwse-resize;
    -webkit-app-region:no-drag;
    opacity:0;transition:opacity .25s ease;
    z-index:6;
    touch-action:none;
  }
  .player:hover .grip{opacity:1;}
  .grip svg{width:100%;height:100%;stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none;}

  /* ── 新版本提醒膠囊：有更新才浮現，點了開下載頁 ── */
  .update{
    position:absolute;left:50%;bottom:calc(24px * var(--s));
    transform:translateX(-50%);
    padding:calc(6px * var(--s)) calc(16px * var(--s));
    border-radius:999px;
    background:var(--bar-bg);
    color:var(--ink);
    font-size:calc(12.5px * var(--s));font-weight:600;letter-spacing:.02em;
    cursor:pointer;
    -webkit-app-region:no-drag;
    opacity:0;pointer-events:none;
    transition:opacity .4s ease, background .15s ease;
    z-index:5;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .player.has-update .update{opacity:1;pointer-events:auto;}
  .update:hover{background:var(--bar-fill);color:#fff;}

  /* 空狀態：Music App 沒在播 */
  .player.empty .info{top:44%;}
  .player.empty .wave i{animation:none;transform:scaleY(.4);}

  @media (prefers-reduced-motion: reduce){
    .disc-face{animation:none;}
    .wave i{animation:none;}
  }
</style>
</head>
<body>

  <div class="player paused eject empty" id="player">
    <div class="clip">
      <div class="disc" id="disc" title="點一下：播放／暫停">
        <div class="disc-face" id="discFace"></div>
      </div>
      <div class="hub" id="hub"></div>
      <div class="cover" id="cover">
        <div class="a" id="coverTitle"></div>
        <div class="t" id="coverArtist"></div>
      </div>
    </div>
    <div class="disc air" id="discAir" hidden>
      <div class="disc-face" id="discFaceAir"></div>
    </div>
    <div class="info">
      <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="artist" id="artist">Music App 沒有正在播放的歌曲</div>
      <div class="title" id="title">未在播放</div>
      <div class="bar"><b id="barFill"></b></div>
      <div class="time"><span id="cur">-:--</span> <span>/ <span id="dur">-:--</span></span></div>
    </div>
    <div class="grip" id="grip" title="拖曳縮放大小">
      <svg viewBox="0 0 44 44"><path d="M 34 12 A 24 24 0 0 1 12 34"/></svg>
    </div>
    <div class="update" id="update" title="打開下載頁取得新版本">有新版本</div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const player = $("player");
  const FALLBACK = "linear-gradient(160deg,#c9c9c8 0%,#b4b4b3 100%)";

  let curId = null, playing = false, pos = 0, dur = 0, switching = false;

  // 視窗縮放 → 內容等比縮放（基準：寬 528px 時 --s = 1）
  function fit(){
    document.documentElement.style.setProperty("--s", (window.innerWidth / 528).toFixed(4));
  }
  window.addEventListener("resize", fit);
  fit();

  const fmt = s => isFinite(s) && s >= 0
    ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`
    : "-:--";

  function render(){
    $("cur").textContent = fmt(pos);
    $("dur").textContent = fmt(dur);
    $("barFill").style.width = dur ? (pos / dur * 100) + "%" : "0%";
  }

  function setPlaying(on){
    playing = on;
    player.classList.toggle("paused", !on);
  }

  // ── 封面取色主題：主色調 → 深/淺兩套配色 ──
  let themeHS = null;

  function rgbToHsl(r, g, b){
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0; const l = (max + min) / 2;
    if (max !== min){
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [Math.round(h), s, l];
  }

  function refreshTheme(){
    const root = document.documentElement.style;
    const KEYS = ["--card-hi","--card-lo","--card-edge","--ink","--ink-soft","--wave","--bar-bg","--bar-fill"];
    if (!themeHS){ KEYS.forEach(k => root.removeProperty(k)); return; }   // 回到中性預設
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const { h, s } = themeHS;
    const S = Math.round(Math.min(s, 0.6) * 100);   // 封面彩度封頂，避免螢光
    if (dark){
      root.setProperty("--card-hi", `hsla(${h},${Math.round(S*.35)}%,24%,.94)`);
      root.setProperty("--card-lo", `hsla(${h},${Math.round(S*.4)}%,13%,.94)`);
      root.setProperty("--card-edge", `hsla(${h},${Math.round(S*.3)}%,80%,.16)`);
      root.setProperty("--ink", "#f5f5f7");
      root.setProperty("--ink-soft", `hsla(${h},18%,78%,.7)`);
      root.setProperty("--wave", `hsla(${h},20%,75%,.55)`);
      root.setProperty("--bar-bg", `hsla(${h},20%,80%,.25)`);
      root.setProperty("--bar-fill", `hsla(${h},${Math.round(S*.7)}%,78%,.95)`);
    } else {
      root.setProperty("--card-hi", `hsla(${h},${Math.round(S*.45)}%,94%,.94)`);
      root.setProperty("--card-lo", `hsla(${h},${Math.round(S*.5)}%,87%,.93)`);
      root.setProperty("--card-edge", `hsla(${h},${Math.round(S*.4)}%,99%,.8)`);
      root.setProperty("--ink", `hsl(${h},18%,14%)`);
      root.setProperty("--ink-soft", `hsla(${h},14%,38%,.72)`);
      root.setProperty("--wave", `hsla(${h},14%,45%,.7)`);
      root.setProperty("--bar-bg", `hsla(${h},${Math.round(S*.3)}%,55%,.3)`);
      root.setProperty("--bar-fill", `hsla(${h},${Math.round(S*.8)}%,36%,.95)`);
    }
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refreshTheme);

  function extractTheme(dataURL){
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = 16;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, 16, 16);
      const d = ctx.getImageData(0, 0, 16, 16).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
      const [h, s] = rgbToHsl(r/n, g/n, b/n);
      themeHS = { h, s };
      refreshTheme();
    };
    img.src = dataURL;
  }

  function applyArt(d){
    const art = d.art ? `url("${d.art}") center / cover no-repeat` : FALLBACK;
    $("discFace").style.background = art;
    $("cover").style.background = art;
    $("artist").textContent = d.artist;
    $("title").textContent = d.name;
    $("coverTitle").textContent = d.name;
    $("coverArtist").textContent = d.artist;
    if (d.art) extractTheme(d.art);
    else { themeHS = null; refreshTheme(); }
  }

  function showEmpty(){
    curId = null;
    pos = 0; dur = 0;
    player.classList.add("eject", "empty", "paused");
    $("artist").textContent = "Music App 沒有正在播放的歌曲";
    $("title").textContent = "未在播放";
    $("cur").textContent = "-:--"; $("dur").textContent = "-:--";
    $("barFill").style.width = "0%";
    themeHS = null; refreshTheme();
  }

  // ── 換片編舞「直上直下」：鬆脫→拿起→空拍→放下→吸入（雙層交棒） ──
  //
  // 註：碟片飛出視窗上緣時會被切（切線 dy = 222*scale - 82）。試過「邊飛邊縮小」與
  //     「碰線前淡出」兩種避切法，Molly 都不喜歡，決定接受切口、保留原本的飛行距離。
  const T = (e) => `translate(-50%,-50%) ${e}`;
  function choreo(){
    const s = window.innerWidth / 528;
    return {
      eject: { kf:[{transform:T("translateY(0) scale(1)")},{transform:T(`translateY(${210*s}px) scale(.92)`)}],
               opt:{duration:260, easing:"cubic-bezier(.3,.6,.3,1)"} },
      lift:  { kf:[{transform:T(`translateY(${210*s}px) scale(.92)`), opacity:1},
                   {transform:T(`translateY(${-80*s}px) scale(.92)`), opacity:1, offset:.6},
                   {transform:T(`translateY(${-290*s}px) scale(.92)`), opacity:0}],
               opt:{duration:310, easing:"cubic-bezier(.5,.05,.75,.4)"} },
      pause: 150,
      lower: { kf:[{transform:T(`translateY(${-290*s}px) scale(.92)`), opacity:0},
                   {transform:T(`translateY(${-210*s}px) scale(.92)`), opacity:1, offset:.18},
                   {transform:T(`translateY(${210*s}px) scale(.92)`), opacity:1}],
               opt:{duration:310, easing:"cubic-bezier(.2,.7,.25,1)"} },
      tuck:  { kf:[{transform:T(`translateY(${210*s}px) scale(.92)`)},{transform:T("translateY(0) scale(1)")}],
               opt:{duration:300, easing:"cubic-bezier(.25,.8,.3,1)"} },
    };
  }

  // 動畫保險：視窗被遮住時 WAAPI 可能停擺，逾時就跳到終點繼續下一拍
  // ⚠️ 動畫自然結束時必須清掉這個計時器：對「已被 cancel 的動畫」呼叫 finish()
  //    會讓它復活並重套 fill:forwards 的終點畫面（碟片會跳回中央）
  let swapAnims = [];   // 自己記住每一段動畫：被瀏覽器「自動回收」的動畫不會出現在
                        // getAnimations()，但取消它的覆蓋者時會復活並重套終點畫面
  function run(el, kf, opt){
    const a = el.animate(kf, { ...opt, fill: "forwards" });
    swapAnims.push(a);
    return new Promise(resolve => {
      let settled = false;
      const done = () => { if (settled) return; settled = true; clearTimeout(timer); resolve(); };
      const timer = setTimeout(() => {
        if (a.playState !== "idle") { try { a.finish(); } catch (e) {} }  // 已取消的不再碰
        done();
      }, opt.duration + 600);
      a.finished.then(done, done);
    });
  }

  let swapGen = 0;   // 世代編號：復位後讓仍在跑的舊序列自動作廢

  function resetSwap(){
    swapGen++;
    const discEl = $("disc"), discAir = $("discAir"), hubEl = $("hub");
    swapAnims.forEach(a => { try { a.cancel(); } catch (e) {} });   // 含已被回收的
    swapAnims = [];
    discEl.getAnimations().forEach(a => a.cancel());
    discAir.getAnimations().forEach(a => a.cancel());
    discAir.hidden = true;
    discEl.style.visibility = "";
    hubEl.style.opacity = "";
    info.style.opacity = "";
    info.style.transform = "";
    player.classList.remove("switching");
    switching = false;
  }

  async function swapDisc(d){
    switching = true;
    player.classList.add("switching");
    const gen = ++swapGen;
    const alive = () => gen === swapGen;
    const discEl = $("disc"), discAir = $("discAir"), faceAir = $("discFaceAir"), hubEl = $("hub");
    const c = choreo();
    // 看門狗：整套動作最多 6 秒，逾時強制復位（避免卡在半途）
    const watchdog = setTimeout(() => { applyArt(d); resetSwap(); }, 6000);
    try {
      hubEl.style.opacity = "0";
      info.style.opacity = "0";
      info.style.transform = "translateY(8px)";

      // 1 鬆脫：滑到面板中央
      await run(discEl, c.eject.kf, c.eject.opt);
      if (!alive()) return;

      // 交棒給 air 層（帶著舊封面）
      faceAir.style.background = $("discFace").style.background;
      discEl.style.visibility = "hidden";
      discAir.hidden = false;

      // 2 拿起：垂直帶走
      await run(discAir, c.lift.kf, c.lift.opt);
      if (!alive()) return;

      // 3 空手一拍
      await new Promise(r => setTimeout(r, c.pause));
      if (!alive()) return;

      // 4 放下：新片垂直降落
      applyArt(d);
      faceAir.style.background = $("discFace").style.background;
      await run(discAir, c.lower.kf, c.lower.opt);
      if (!alive()) return;

      // 交棒回 slot 層；新片從正面開始轉
      discAir.hidden = true;
      const f = $("discFace");
      f.style.animation = "none"; void f.offsetWidth; f.style.animation = "";
      discEl.style.visibility = "";

      // 5 吸入：套回軸心
      const infoBack = setTimeout(() => {
        info.style.opacity = "";
        info.style.transform = "";
      }, c.tuck.opt.duration * 0.4);
      await run(discEl, c.tuck.kf, c.tuck.opt);
      clearTimeout(infoBack);
    } finally {
      // 清場：取消 WAAPI，讓 CSS（hover／--dy）接回控制權
      clearTimeout(watchdog);
      resetSwap();
    }
  }
  const info = document.querySelector(".info");

  window.mp.onNowPlaying(d => {
    if (d.state === "stopped"){ if (!switching) showEmpty(); return; }
    player.classList.remove("empty");
    pos = d.pos; dur = d.dur;

    if (d.id !== curId){
      const first = (curId === null);
      curId = d.id;
      if (first){
        applyArt(d);
        setTimeout(() => player.classList.remove("eject"), 120);
      } else if (document.hidden){
        applyArt(d);          // 沒人在看時直接換，不演動畫（也避免被凍結卡住）
      } else if (!switching){
        swapDisc(d);
      }
    }
    setPlaying(d.state === "playing");
    render();
  });

  // 每秒 poll 之間用本地計時內插，進度移動才順滑
  setInterval(() => {
    if (playing && dur){ pos = Math.min(pos + 0.25, dur); render(); }
  }, 250);

  $("disc").addEventListener("click", () => window.mp.control("playpause"));

  // ── hover 離開時讓 CD 從正面重新開始轉：封面（正的）縮回去時底下的 CD 也是正的，銜接不突兀 ──
  // 快速掃過（封面還沒蓋住 CD）不歸零，避免看得到的角度跳動
  let hoverAt = 0;
  player.addEventListener("mouseenter", () => { hoverAt = performance.now(); });
  player.addEventListener("mouseleave", () => {
    if (performance.now() - hoverAt < 350) return;
    const f = $("discFace");
    f.style.animation = "none";
    void f.offsetWidth;               // 強制 reflow，讓旋轉歸零生效
    f.style.animation = "";
  });

  // ── 右下角把手：拖曳縮放（pointer capture，拖出視窗外也追得到） ──
  const grip = $("grip");
  let rs = null;
  grip.addEventListener("pointerdown", e => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    rs = { x: e.screenX, w: window.innerWidth };
  });
  grip.addEventListener("pointermove", e => {
    if (!rs) return;
    window.mp.resizeTo(rs.w + (e.screenX - rs.x));
  });
  const endResize = e => { if (rs){ rs = null; window.mp.resizeEnd(); } };
  grip.addEventListener("pointerup", endResize);
  grip.addEventListener("pointercancel", endResize);

  // ── 新版本提醒 ──
  if (window.mp.onUpdate) window.mp.onUpdate(v => {
    player.classList.add("has-update");
    $("update").textContent = `有新版本 ${v}`;
  });
  $("update").addEventListener("click", () => window.mp.openDownload());
})();
</script>
</body>
</html>
