<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>My Playlist</title>
<style>
  :root{
    --page-bg:#f1f1f0;
    --card-hi:#ececeb;
    --card-lo:#d7d6d5;
    --ink:#1c1c1e;
    --ink-soft:#a5a5a7;
    --card-size:420px;
    --card-radius:76px;
    --disc-size:444px;
    --dy:0px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang TC", sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    -webkit-app-region:drag;          /* 整個視窗可拖曳移動 */
    user-select:none;
    zoom:0.72;                        /* 桌面 widget 縮小比例（卡片約 300px） */
  }

  .player{
    position:relative;
    width:var(--card-size);height:var(--card-size);
    border-radius:var(--card-radius);
    background:linear-gradient(180deg,var(--card-hi) 0%,var(--card-lo) 100%);
    box-shadow:
      0 30px 60px -18px rgba(0,0,0,.22),
      0 10px 24px -10px rgba(0,0,0,.10),
      inset 0 1px 0 rgba(255,255,255,.65);
  }

  .clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;}

  .disc{
    position:absolute;left:50%;top:0;
    width:var(--disc-size);height:var(--disc-size);
    transform:translate(-50%,-50%) translateY(var(--dy));
    transition:transform .65s cubic-bezier(.32,.72,.28,1);
    will-change:transform;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.28));
    -webkit-app-region:no-drag;       /* CD 可點（播放/暫停） */
    cursor:pointer;
  }
  .disc-face{
    width:100%;height:100%;border-radius:50%;
    background:linear-gradient(160deg,#c9c9c8 0%,#b4b4b3 100%);
    background-size:cover;background-position:center;
    animation:spin 9s linear infinite;
    position:relative;overflow:hidden;
  }
  .player.paused .disc-face{animation-play-state:paused;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .disc-face::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 20deg,
      rgba(255,255,255,0) 0deg, rgba(255,255,255,.20) 40deg, rgba(255,255,255,0) 90deg,
      rgba(255,255,255,0) 170deg, rgba(255,255,255,.14) 215deg, rgba(255,255,255,0) 260deg);
    mix-blend-mode:screen;
  }

  .hub{
    position:absolute;left:50%;top:0;
    width:84px;height:84px;border-radius:50%;
    transform:translate(-50%,-50%) translateY(var(--dy));
    transition:transform .65s cubic-bezier(.32,.72,.28,1),opacity .4s ease;
    background:
      radial-gradient(circle,
        rgba(238,238,237,.30) 0 15%,
        rgba(180,180,180,.60) 15.5% 18%,
        rgba(244,244,243,.55) 18.5% 42%,
        rgba(188,188,188,.60) 42.5% 47%,
        rgba(232,232,231,.45) 47.5% 100%);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    box-shadow:0 2px 8px rgba(0,0,0,.14);
    pointer-events:none;
  }

  .cover{
    position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(160deg,#c9c9c8 0%,#b4b4b3 100%);
    background-size:cover;background-position:center;
    opacity:0;transform:scale(1.045);
    transition:opacity .45s ease .18s, transform .6s cubic-bezier(.32,.72,.28,1) .1s;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:44px 48px;
  }
  .cover .a{color:#fff;font-size:24px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.45);}
  .cover .t{color:rgba(255,255,255,.88);font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.4);}

  .player:not(.empty):hover{--dy:210px;}
  .player:not(.empty):hover .disc{transform:translate(-50%,-50%) translateY(var(--dy)) scale(1.02);}
  .player:not(.empty):hover .cover{opacity:1;transform:scale(1);}
  .player:not(.empty):hover .hub{opacity:0;}
  .player:not(.empty):hover .info{opacity:0;transform:translateY(8px);}

  .player.eject{--dy:-300px;}
  .player.eject .hub{opacity:0;}
  .player.eject .disc{filter:drop-shadow(0 4px 10px rgba(0,0,0,.15));}

  .info{
    position:absolute;left:0;right:0;top:57%;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:opacity .3s ease,transform .3s ease;
  }
  .wave{display:flex;align-items:center;gap:3px;height:18px;}
  .wave i{width:3px;border-radius:2px;background:#8f8f92;animation:bounce 1s ease-in-out infinite;}
  .wave i:nth-child(1){height:8px;animation-delay:0s;}
  .wave i:nth-child(2){height:14px;animation-delay:.15s;}
  .wave i:nth-child(3){height:18px;animation-delay:.3s;}
  .wave i:nth-child(4){height:12px;animation-delay:.45s;}
  .wave i:nth-child(5){height:7px;animation-delay:.6s;}
  @keyframes bounce{0%,100%{transform:scaleY(.55);}50%{transform:scaleY(1);}}
  .player.paused .wave i{animation-play-state:paused;transform:scaleY(.4);}

  .artist{font-size:19px;font-weight:500;color:var(--ink-soft);letter-spacing:.01em;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .title{font-size:23px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-top:-3px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .bar{width:66px;height:4px;border-radius:2px;background:#c2c2c3;overflow:hidden;margin-top:2px;}
  .bar b{display:block;height:100%;width:0%;background:#68686b;border-radius:2px;transition:width .25s linear;}

  .time{font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .time span{color:var(--ink-soft);font-weight:500;}

  /* 空狀態：Music App 沒在播 */
  .player.empty .info{top:44%;}
  .player.empty .wave i{animation:none;transform:scaleY(.4);}

  @media (prefers-reduced-motion: reduce){
    .disc-face{animation:none;}
    .wave i{animation:none;}
  }
</style>
</head>
<body>

  <div class="player paused eject empty" id="player">
    <div class="clip">
      <div class="disc" id="disc" title="點一下：播放／暫停">
        <div class="disc-face" id="discFace"></div>
      </div>
      <div class="hub"></div>
      <div class="cover" id="cover">
        <div class="a" id="coverTitle"></div>
        <div class="t" id="coverArtist"></div>
      </div>
    </div>
    <div class="info">
      <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="artist" id="artist">Music App 沒有正在播放的歌曲</div>
      <div class="title" id="title">未在播放</div>
      <div class="bar"><b id="barFill"></b></div>
      <div class="time"><span id="cur">-:--</span> <span>/ <span id="dur">-:--</span></span></div>
    </div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const player = $("player");
  const FALLBACK = "linear-gradient(160deg,#c9c9c8 0%,#b4b4b3 100%)";

  let curId = null, playing = false, pos = 0, dur = 0, switching = false;

  const fmt = s => isFinite(s) && s >= 0
    ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`
    : "-:--";

  function render(){
    $("cur").textContent = fmt(pos);
    $("dur").textContent = fmt(dur);
    $("barFill").style.width = dur ? (pos / dur * 100) + "%" : "0%";
  }

  function setPlaying(on){
    playing = on;
    player.classList.toggle("paused", !on);
  }

  function applyArt(d){
    const art = d.art ? `url("file://${d.art}") center / cover no-repeat` : FALLBACK;
    $("discFace").style.background = art;
    $("cover").style.background = art;
    $("artist").textContent = d.artist;
    $("title").textContent = d.name;
    $("coverTitle").textContent = d.name;
    $("coverArtist").textContent = d.artist;
  }

  function showEmpty(){
    curId = null;
    pos = 0; dur = 0;
    player.classList.add("eject", "empty", "paused");
    $("artist").textContent = "Music App 沒有正在播放的歌曲";
    $("title").textContent = "未在播放";
    $("cur").textContent = "-:--"; $("dur").textContent = "-:--";
    $("barFill").style.width = "0%";
  }

  window.mp.onNowPlaying(d => {
    if (d.state === "stopped"){ showEmpty(); return; }
    player.classList.remove("empty");
    pos = d.pos; dur = d.dur;

    if (d.id !== curId){
      const first = (curId === null);
      curId = d.id;
      if (first){
        applyArt(d);
        setTimeout(() => player.classList.remove("eject"), 120);
      } else if (!switching){
        // 換歌：退片 → 換封面 → 插片
        switching = true;
        player.classList.add("eject");
        setTimeout(() => {
          applyArt(d);
          player.classList.remove("eject");
          setTimeout(() => (switching = false), 650);
        }, 660);
      }
    }
    setPlaying(d.state === "playing");
    render();
  });

  // 每秒 poll 之間用本地計時內插，進度移動才順滑
  setInterval(() => {
    if (playing && dur){ pos = Math.min(pos + 0.25, dur); render(); }
  }, 250);

  $("disc").addEventListener("click", () => window.mp.control("playpause"));
})();
</script>
</body>
</html>
